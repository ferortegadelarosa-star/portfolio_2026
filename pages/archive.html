<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — fer´s way</title>
    <meta name="description"
        content="A visual archive of personal explorations in illustration, 3D, motion and experimental design.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo web.svg">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* ─── Archive Page ─────────────────────────────────────── */
        body {
            background: #E7E7E7;
            overflow: hidden;
            cursor: none;
            margin: 0;
            padding: 0;
        }

        /* ─── Custom Cursor ────────────────────────────────────── */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 25px;
            height: 25px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-70%, -70%);
            will-change: transform;
        }

        .cursor-circle {
            transition: fill 0.3s ease, stroke 0.3s ease, r 0.3s ease;
        }

        .custom-cursor.active .cursor-circle {
            fill: #1d1d1b;
            stroke-width: 0;
        }

        .custom-cursor.hovering .cursor-circle {
            r: 12;
            fill: rgba(255, 255, 255, 0.12);
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        /* ─── Viewport Wrapper ─────────────────────────────────── */
        .archive-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Canvas (pans with cursor) ────────────────────────── */
        .archive-canvas {
            position: absolute;
            top: 0;
            left: 0;
            column-count: 5;
            column-gap: 18px;
            width: 1800px;
            padding: 100px 60px 60px;
            will-change: transform;
            transition: none;
        }

        /* Large screens: scale canvas proportionally so it overflows */
        @media (min-width: 1800px) {
            .archive-canvas {
                width: 140vw;
                min-width: 2400px;
            }
        }

        @media (min-width: 2400px) {
            .archive-canvas {
                width: 150vw;
                min-width: 3200px;
            }
        }

        /* ─── Card ─────────────────────────────────────────────── */
        .archive-card {
            cursor: pointer;
            break-inside: avoid;
            margin-bottom: 18px;
            border-radius: 10px;
            overflow: hidden;
            background: #d4d4d4;
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            animation: cardReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: box-shadow 0.4s ease, transform 0.4s ease;
        }

        .archive-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            transform: translateY(-3px) scale(1);
        }

        @keyframes cardReveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .archive-card img,
        .archive-card video {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .archive-card:hover img,
        .archive-card:hover video {
            transform: scale(1.04);
        }

        /* Video play icon */
        .archive-card .play-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .play-badge svg {
            width: 12px;
            height: 12px;
            fill: #fff;
        }

        /* ─── Lightbox Overlay ─────────────────────────────────── */
        .archive-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .archive-lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .archive-lightbox-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 18, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .archive-lightbox-content {
            position: relative;
            display: flex;
            align-items: center;
            gap: 40px;
            max-width: 90vw;
            max-height: 85vh;
            transform: translateY(30px) scale(0.95);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .archive-lightbox.active .archive-lightbox-content {
            transform: translateY(0) scale(1);
        }

        /* Media container */
        .archive-lightbox-media {
            flex-shrink: 0;
            max-width: 60vw;
            max-height: 80vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
        }

        .archive-lightbox-media img,
        .archive-lightbox-media video {
            display: block;
            max-width: 60vw;
            max-height: 80vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Info card */
        .archive-lightbox-info {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #FCFCF7;
        }

        .lightbox-category {
            font-family: 'Space Mono', 'SF Mono', 'Fira Code', monospace;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(252, 252, 247, 0.45);
        }

        .lightbox-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: #FCFCF7;
        }

        .lightbox-divider {
            width: 36px;
            height: 1px;
            background: rgba(252, 252, 247, 0.18);
        }

        .lightbox-year {
            font-family: 'Space Mono', 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            font-weight: 400;
            color: rgba(252, 252, 247, 0.5);
            letter-spacing: 0.06em;
        }

        .lightbox-desc {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.65;
            color: rgba(252, 252, 247, 0.6);
        }

        /* Close button */
        .archive-lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 36px;
            height: 36px;
            background: rgba(252, 252, 247, 0.08);
            border: 1px solid rgba(252, 252, 247, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .archive-lightbox-close:hover {
            background: rgba(252, 252, 247, 0.15);
            transform: rotate(90deg);
        }

        .archive-lightbox-close svg {
            width: 14px;
            height: 14px;
            stroke: #FCFCF7;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ─── Lightbox Responsive ───────────────────────────────── */
        @media (max-width: 900px) {
            .archive-lightbox-content {
                flex-direction: column;
                max-width: 92vw;
                gap: 24px;
            }

            .archive-lightbox-media {
                max-width: 88vw;
            }

            .archive-lightbox-media img,
            .archive-lightbox-media video {
                max-width: 88vw;
                max-height: 55vh;
            }

            .archive-lightbox-info {
                width: 100%;
                max-width: 400px;
                text-align: center;
                align-items: center;
            }

            .archive-lightbox-close {
                top: -44px;
                right: 0;
            }
        }

        /* ─── Card size variants (no longer needed — masonry auto-sizes) ─── */

        /* ─── Page title overlay ───────────────────────────────── */
        .archive-title-overlay {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            text-align: center;
        }

        .archive-title-overlay h1 {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(29, 29, 27, 0.35);
            font-family: 'Space Mono', 'SF Mono', 'Fira Code', monospace;
        }

        /* ─── Vignette border effect ───────────────────────────── */
        .archive-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            box-shadow: inset 0 0 120px 40px rgba(231, 231, 231, 0.9);
        }

        /* ─── Responsive ───────────────────────────────────────── */
        @media (max-width: 1024px) {
            .archive-canvas {
                column-count: 4;
                width: 1200px;
                gap: 14px;
                padding: 90px 40px 40px;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                cursor: auto;
            }

            .archive-viewport {
                position: relative;
                height: auto;
                overflow: visible;
            }

            .archive-canvas {
                position: relative;
                column-count: 2;
                width: 100%;
                gap: 12px;
                padding: 80px 16px 40px;
                transform: none !important;
            }

            .archive-card {
                margin-bottom: 12px;
            }

            .archive-vignette {
                display: none;
            }

            .custom-cursor {
                display: none;
            }

            .archive-title-overlay {
                bottom: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- ═══════════════════════ CUSTOM CURSOR ═══════════════════════ -->
    <div class="custom-cursor" id="customCursor">
        <svg width="20" height="20" viewBox="0 0 20 20">
            <circle class="cursor-circle" cx="10" cy="10" r="8" fill="transparent" stroke="#1d1d1b"
                stroke-width="2.5" />
        </svg>
    </div>

    <!-- ═══════════════════════ NAVBAR ═══════════════════════ -->
    <nav class="navbar" id="navbar">
        <a href="../index.html" class="nav-logo" aria-label="Go to home">
            <svg class="nav-logo-svg" viewBox="0 0 92.7 96" fill="#ffffff">
                <path
                    d="M54.92,0c.66.29,1.92,1.29,1.92,2.04v34.32l.36.36h33.84c.07,0,.92.71,1.05.87,2.72,3.66-4.33,5.19-6.61,6.28-21.43,10.26-37.63,28.07-44.91,50.85l-1.49,1.27h-1.44c-.66-.29-1.92-1.29-1.92-2.04v-34.68H1.52c-1.14,0-1.82-2.45-1.38-3.54.6-1.47,4.9-2.64,6.46-3.38,18.41-8.71,33.08-22.81,41.64-41.4.75-1.63,3.59-9.72,4.15-10.25.31-.29.83-.34,1.09-.71h1.44Z" />
            </svg>
        </a>
        <button class="nav-menu-btn" id="menuToggle" aria-label="Toggle menu">
            <svg class="nav-menu-svg" viewBox="0 0 18 12" fill="#ffffff">
                <path
                    d="M0,11h0c0-.55.45-1,1-1h16c.55,0,1,.45,1,1h0c0,.55-.45,1-1,1H1c-.55,0-1-.45-1-1ZM0,6h0c0-.55.45-1,1-1h16c.55,0,1,.45,1,1h0c0,.55-.45,1-1,1H1c-.55,0-1-.45-1-1ZM0,1h0C0,.45.45,0,1,0h16c.55,0,1,.45,1,1h0c0,.55-.45,1-1,1H1c-.55,0-1-.45-1-1Z" />
            </svg>
        </button>
    </nav>

    <!-- ═══════════════════════ MENU OVERLAY ═══════════════════════ -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-overlay-backdrop" id="menuBackdrop"></div>
        <div class="menu-overlay-panel" id="menuPanel">
            <div class="menu-overlay-header">
                <button class="nav-close-btn" id="menuClose" aria-label="Close menu">
                    <svg class="nav-close-svg" viewBox="0 0 14 14" fill="none" stroke="#ffffff" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="1" y1="1" x2="13" y2="13" />
                        <line x1="13" y1="1" x2="1" y2="13" />
                    </svg>
                </button>
            </div>
            <div class="menu-overlay-content">
                <nav class="menu-nav">
                    <a href="../index.html" class="menu-nav-link" data-index="01">Home</a>
                    <a href="../index.html#works" class="menu-nav-link" data-index="02">Works</a>
                    <a href="about.html" class="menu-nav-link" data-index="04">About</a>
                    <a href="../index.html#contact" class="menu-nav-link" data-index="05">Contact</a>
                </nav>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════ ARCHIVE VIEWPORT ═══════════════════════ -->
    <div class="archive-viewport" id="archiveViewport">
        <div class="archive-canvas" id="archiveCanvas">
            <!-- Cards rendered by JS -->
        </div>
    </div>

    <!-- Vignette edge fade -->
    <div class="archive-vignette"></div>

    <!-- Bottom label -->
    <div class="archive-title-overlay">
        <h1>Archive — 2023 / 2026</h1>
    </div>

    <!-- ═══════════════════════ LIGHTBOX OVERLAY ═══════════════════════ -->
    <div class="archive-lightbox" id="archiveLightbox">
        <div class="archive-lightbox-backdrop" id="lightboxBackdrop"></div>
        <div class="archive-lightbox-content">
            <div class="archive-lightbox-media" id="lightboxMedia"></div>
            <div class="archive-lightbox-info" id="lightboxInfo"></div>
            <button class="archive-lightbox-close" id="lightboxClose" aria-label="Close">
                <svg viewBox="0 0 14 14" fill="none">
                    <line x1="1" y1="1" x2="13" y2="13" />
                    <line x1="13" y1="1" x2="1" y2="13" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // ─── Archive Items Data ───────────────────────────────
        const archiveItems = [
            { file: 'flame.jpg', type: 'image', size: 'A2', title: 'Flame', year: '2025', category: 'Digital Art', desc: 'Fire as a metaphor for creative passion.' },
            { file: 'ASCII.mp4', type: 'video', size: '2x1', title: 'ASCII', year: '2025', category: 'Motion', desc: 'Text-based visual experiment in code aesthetics.' },
            { file: 'centralcee.jpg', type: 'image', size: '1x2', title: 'Central Cee', year: '2024', category: 'Photography', desc: 'Portrait study exploring urban aesthetics.' },
            { file: 'summer.jpg', type: 'image', size: '1x1', title: 'Summer', year: '2024', category: 'Photography', desc: 'Warmth and golden hour captured.' },
            { file: 'desire final pt.jpg', type: 'image', size: '1x1', title: 'Desire', year: '2025', category: 'Digital Art', desc: 'Visual exploration of longing and texture.' },
            { file: 'helio.jpg', type: 'image', size: '2x1', title: 'Helio', year: '2025', category: 'Digital Art', desc: 'Solar-inspired abstract composition.' },
            { file: 'i see you baby boi.jpg', type: 'image', size: 'A3', title: 'Run', year: '2024', category: 'Poster', desc: 'Poster to explore differentes layout.' },
            { file: 'sunsun.jpg', type: 'image', size: '1x2', title: 'Sun Sun', year: '2025', category: 'Digital Art', desc: 'Layered solar motifs in vivid color.' },
            { file: 'nintendo_camara3_1.jpg', type: 'image', size: '1x1', title: 'Nintendo', year: '2024', category: '3D Render', desc: 'Product visualization study.' },
            { file: 'animacion_logo.mp4', type: 'video', size: '1x1', title: 'Logo Animation', year: '2025', category: 'Motion', desc: 'Brand identity brought to life.' },
        ];

        const basePath = '../assets/img/archive/';
        const canvas = document.getElementById('archiveCanvas');

        // ─── Build Cards ──────────────────────────────────────
        // ─── Lightbox elements ─────────────────────────────────
        const lightbox = document.getElementById('archiveLightbox');
        const lightboxMedia = document.getElementById('lightboxMedia');
        const lightboxInfo = document.getElementById('lightboxInfo');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxBackdrop = document.getElementById('lightboxBackdrop');
        let panningPaused = false;

        function openLightbox(item) {
            const src = basePath + item.file;
            // Media
            if (item.type === 'video') {
                lightboxMedia.innerHTML = `<video src="${src}" autoplay loop muted playsinline></video>`;
            } else {
                lightboxMedia.innerHTML = `<img src="${src}" alt="${item.title}">`;
            }
            // Info
            lightboxInfo.innerHTML = `
                <span class="lightbox-category">${item.category}</span>
                <span class="lightbox-title">${item.title}</span>
                <div class="lightbox-divider"></div>
                <span class="lightbox-year">${item.year}</span>
                <p class="lightbox-desc">${item.desc}</p>`;

            lightbox.classList.add('active');
            panningPaused = true;
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            panningPaused = false;
            // Stop video playback after transition
            setTimeout(() => { lightboxMedia.innerHTML = ''; }, 500);
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxBackdrop.addEventListener('click', closeLightbox);

        // ─── Build Cards ──────────────────────────────────────
        archiveItems.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'archive-card';
            card.style.animationDelay = `${0.08 + i * 0.06}s`;
            card.style.position = 'relative';

            const src = basePath + item.file;
            if (item.type === 'video') {
                card.innerHTML = `
                    <video src="${src}" autoplay loop muted playsinline preload="metadata"></video>`;
            } else {
                card.innerHTML = `<img src="${src}" alt="${item.title}" loading="lazy">`;
            }

            // Click to open lightbox
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                openLightbox(item);
            });

            canvas.appendChild(card);
        });

        // ─── Cursor-Based Panning ─────────────────────────────
        let targetX = 0, targetY = 0;
        let panX = 0, panY = 0;
        const isMobile = window.innerWidth <= 768;

        // Extra overflow margin ensures there's always room to pan
        const PAN_MARGIN = 200;

        function getMaxPan() {
            const cw = canvas.scrollWidth;
            const ch = canvas.scrollHeight;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            return {
                x: Math.max(PAN_MARGIN, cw - vw + PAN_MARGIN),
                y: Math.max(PAN_MARGIN, ch - vh + PAN_MARGIN)
            };
        }

        function updatePan() {
            if (isMobile) return;
            panX += (targetX - panX) * 0.06;
            panY += (targetY - panY) * 0.06;
            canvas.style.transform = `translate(${panX}px, ${panY}px)`;
            requestAnimationFrame(updatePan);
        }

        if (!isMobile) {
            document.addEventListener('mousemove', (e) => {
                if (panningPaused) return;
                const ratioX = e.clientX / window.innerWidth;
                const ratioY = e.clientY / window.innerHeight;
                const max = getMaxPan();
                targetX = -ratioX * max.x;
                targetY = -ratioY * max.y;
            });
            // Initial center
            requestAnimationFrame(() => {
                const max = getMaxPan();
                panX = -max.x * 0.3;
                panY = -max.y * 0.3;
                targetX = panX;
                targetY = panY;
                canvas.style.transform = `translate(${panX}px, ${panY}px)`;
            });
            updatePan();
        }

        // ─── Custom Cursor ────────────────────────────────────
        const customCursor = document.getElementById('customCursor');
        let cursorX = 0, cursorY = 0;
        let cX = 0, cY = 0;

        document.addEventListener('mousemove', (e) => {
            cursorX = e.clientX;
            cursorY = e.clientY;
            const el = document.elementFromPoint(e.clientX, e.clientY);
            if (el && el.closest('.archive-card')) {
                customCursor.classList.add('hovering');
            } else {
                customCursor.classList.remove('hovering');
            }
        });

        function updateCursor() {
            cX += (cursorX - cX) * 0.15;
            cY += (cursorY - cY) * 0.15;
            customCursor.style.transform = `translate(${cX - 10}px, ${cY - 10}px)`;
            requestAnimationFrame(updateCursor);
        }
        updateCursor();

        document.addEventListener('mousedown', () => customCursor.classList.add('active'));
        document.addEventListener('mouseup', () => {
            setTimeout(() => customCursor.classList.remove('active'), 150);
        });

        // ─── Menu Overlay ─────────────────────────────────────
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuBackdrop = document.getElementById('menuBackdrop');

        function openMenu() {
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeMenu() {
            menuOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        menuToggle.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuBackdrop.addEventListener('click', closeMenu);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeLightbox(); closeMenu(); }
        });

        // ─── Lazy video loading — pause off-screen videos ─────
        if ('IntersectionObserver' in window) {
            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play().catch(() => { });
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.archive-card-front video').forEach(v => {
                videoObserver.observe(v);
            });
        }
    </script>

</body>

</html>
