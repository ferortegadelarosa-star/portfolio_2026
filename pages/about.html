<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — fer´s way</title>
    <meta name="description" content="Creative designer specializing in branding, editorial and web design.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo web.svg">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* ─── About Page Specific Styles ───────────────────────── */
        body {
            background: #FCFCF7;
            color: #1d1d1b;
            overflow: hidden;
            cursor: none;
        }

        /* ─── Layout: Split Screen ─────────────────────────────── */
        .about-page {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: var(--nav-height);
        }

        /* ─── Left Panel (Fixed) ───────────────────────────────── */
        .about-left {
            width: 42%;
            height: calc(100vh - var(--nav-height));
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 48px 60px 56px;
            gap: 32px;
            overflow: hidden;
        }

        /* Profile Photo */
        .about-photo-wrapper {
            width: 200px;
            height: 200px;
            border-radius: 6%;
            overflow: hidden;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(30px);
            animation: aboutReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .about-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(10%);
            transition: filter 0.5s ease;
        }

        .about-photo-wrapper:hover .about-photo {
            filter: grayscale(0%);
        }

        /* Text Block */
        .about-text-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            animation: aboutReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        }

        .about-name {
            font-size: clamp(24px, 2.5vw, 34px);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #1d1d1b;
            line-height: 1.1;
        }

        .about-info-row {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .about-location {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 17px;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.02em;
        }

        .about-location svg {
            width: 20px;
            height: 20px;
            fill: #888;
            flex-shrink: 0;
        }

        @property --fw {
            syntax: '<number>';
            inherits: false;
            initial-value: 500;
        }

        .about-location a {
            color: inherit;
            text-decoration: none;
            font-style: normal;
            --fw: 500;
            font-weight: var(--fw);
            transition: color 0.35s cubic-bezier(0.25, 0.1, 0.25, 1),
                --fw 0.4s cubic-bezier(0.33, 0, 0.2, 1);
        }

        .about-location a:hover {
            color: #002fff;
            font-style: italic;
        }

        .about-tagline {
            font-size: clamp(18px, 2vw, 24px);
            font-style: italic;
            font-weight: 700;
            color: #002fff;
            line-height: 1.3;
        }

        .about-role {
            font-family: 'Space Mono', 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            font-weight: 550;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #002fff;
        }

        .about-bio {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.7;
            color: #555;
            max-width: 380px;
        }

        /* Social Icons */
        .about-socials {
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: translateY(15px);
            animation: aboutReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        .about-social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid rgba(29, 29, 27, 0.15);
            color: #1d1d1b;
            transition: all 0.3s ease;
        }

        .about-social-link:hover {
            background: #002fff;
            border-color: #002fff;
            color: #FCFCF7;
            transform: translateY(-3px);
        }

        .about-social-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ─── Divider ──────────────────────────────────────────── */
        .about-divider {
            width: 1px;
            height: calc(100vh - var(--nav-height));
            background: rgba(29, 29, 27, 0.1);
            flex-shrink: 0;
        }

        /* ─── Right Panel (Scrollable) ─────────────────────────── */
        .about-right {
            flex: 1;
            height: calc(100vh - var(--nav-height));
            overflow-y: auto;
            padding: 40px 40px 80px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.1) transparent;
        }

        .about-right::-webkit-scrollbar {
            width: 5px;
        }

        .about-right::-webkit-scrollbar-track {
            background: transparent;
        }

        .about-right::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 3px;
        }

        .about-right-label {
            font-family: 'Space Mono', 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(10px);
            animation: aboutReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        /* Skills Section */
        .skills-container {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .skills-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 10px;
            border-bottom: 1px solid rgba(29, 29, 27, 0.08);
            opacity: 0;
            transform: translateY(15px);
            animation: aboutReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .skills-group-label {
            font-family: 'Space Mono', 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #002fff;
        }

        .skills-group-count {
            font-family: 'Space Mono', 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            font-weight: 400;
            color: #bbb;
            letter-spacing: 0.05em;
        }

        .skill-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(29, 29, 27, 0.05);
            opacity: 0;
            transform: translateY(15px);
            animation: aboutReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .skill-name {
            font-size: 14px;
            font-weight: 500;
            color: #1d1d1b;
            white-space: nowrap;
            min-width: 110px;
            flex-shrink: 0;
        }

        .skill-bar {
            flex: 1;
            height: 7px;
            background: rgba(29, 29, 27, 0.06);
            border-radius: 25px;
            overflow: hidden;
        }

        .skill-bar-fill {
            height: 100%;
            width: 0;
            background: #002fff;
            border-radius: 2px;
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ─── Animation ────────────────────────────────────────── */
        @keyframes aboutReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── Navbar overrides for about page ────────────── */
        /* The floating pill navbar keeps its blue styling on all pages */

        /* ─── Custom Cursor (light theme) ──────────────────────── */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 25px;
            height: 25px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-70%, -70%);
            will-change: transform;
        }

        .cursor-circle {
            transition: fill 0.3s ease, stroke 0.3s ease, stroke-width 0.3s ease;
        }

        .custom-cursor.active .cursor-circle {
            fill: #1d1d1b;
            stroke-width: 0;
        }

        /* ─── Responsive ──────────────────────────────────────── */
        @media (max-width: 1024px) {
            .about-left {
                width: 44%;
                padding: 40px 36px 40px 40px;
                gap: 24px;
            }

            .about-photo-wrapper {
                width: 180px;
                height: 180px;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }

            .about-page {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .about-left {
                width: 100%;
                height: auto;
                padding: 40px 24px 32px;
                align-items: center;
                text-align: center;
            }

            .about-photo-wrapper {
                width: 140px;
                height: 140px;
            }

            .about-bio {
                max-width: 100%;
            }

            .about-socials {
                justify-content: center;
            }

            .about-divider {
                width: 100%;
                height: 1px;
            }

            .about-right {
                height: auto;
                overflow-y: visible;
                padding: 32px 24px 60px;
            }

            .about-right-label {
                text-align: center;
            }

            .skill-name {
                min-width: 90px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .about-name {
                font-size: 28px;
            }

            .skill-name {
                min-width: 80px;
            }
        }
    </style>
</head>

<body>

                    <a href="about.html" class="menu-nav-link" data-index="04">About</a>
                    <a href="../index.html#contact" class="menu-nav-link" data-index="05">Contact</a>
                </nav>
            </div>

    </div>

    <!-- ═══════════════════════ ABOUT PAGE ═══════════════════════ -->

        <div class="about-left">

        <!-- ─── Divider ─────────────────────────────────────────── -->

        <!-- ─── Right Panel (Skills) ──────────────────────────── -->
        <div class="about-right">
            <p class="about-right-label">Skills & Tools</p>

            <div class="skills-container" id="skillsContainer">
                <!-- Generated dynamically by JS -->
            </div>
        </div>

    </main>

    <script>
        // ─── Custom Cursor ─────────────────────────────────────
        const customCursor = document.getElementById('customCursor');
        let cursorX = 0, cursorY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            cursorX = e.clientX;
            cursorY = e.clientY;
        });

        function updateCursor() {
            currentX += (cursorX - currentX) * 0.15;
            currentY += (cursorY - currentY) * 0.15;
            customCursor.style.transform = `translate(${currentX - 10}px, ${currentY - 10}px)`;
            requestAnimationFrame(updateCursor);
        }
        updateCursor();

        document.addEventListener('mousedown', () => {
            customCursor.classList.add('active');
        });

        document.addEventListener('mouseup', () => {
            setTimeout(() => {
                customCursor.classList.remove('active');
            }, 150);
        });

        // ─── Menu Overlay ─────────────────────────────────────
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuBackdrop = document.getElementById('menuBackdrop');

        function openMenu() {
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            menuOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        menuToggle.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuBackdrop.addEventListener('click', closeMenu);

        // ─── Skills Data ──────────────────────────────────────
        // level: 'advanced' | 'intermediate' | 'learning'
        const skills = [
            { name: 'Figma', level: 'advanced' },
            { name: 'Framer', level: 'intermediate' },
            { name: 'Photoshop', level: 'advanced' },
            { name: 'Illustrator', level: 'advanced' },
            { name: 'InDesign', level: 'advanced' },
            { name: 'Claude', level: 'advanced' },
            { name: 'Gemini', level: 'advanced' },
            { name: 'Midjourney', level: 'intermediate' },
            { name: 'After Effects', level: 'intermediate' },
            { name: 'Premiere Pro', level: 'intermediate' },
            { name: 'HTML / CSS', level: 'advanced' },
            { name: 'Cinema 4D', level: 'learning' },
            { name: 'Rhinoceros', level: 'learning' },
            { name: 'JavaScript', level: 'learning' },
            { name: 'TouchDesigner', level: 'learning' },
        ];

        const levelMeta = {
            advanced: { label: 'Advanced', pct: 100 },
            intermediate: { label: 'Intermediate', pct: 65 },
            learning: { label: 'Learning', pct: 30 },
        };

        const levelOrder = ['advanced', 'intermediate', 'learning'];

        function renderSkills() {
            const container = document.getElementById('skillsContainer');
            container.innerHTML = '';
            let idx = 0;

            levelOrder.forEach(level => {
                const items = skills.filter(s => s.level === level);
                if (items.length === 0) return;

                const meta = levelMeta[level];

                // Group header
                const header = document.createElement('div');
                header.className = 'skills-group-header';
                header.style.animationDelay = `${0.3 + idx * 0.06}s`;
                header.innerHTML = `
                    <span class="skills-group-label">${meta.label}</span>
                    <span class="skills-group-count">${String(items.length).padStart(2, '0')}</span>
                `;
                container.appendChild(header);

                // Skill rows
                items.forEach(skill => {
                    idx++;
                    const row = document.createElement('div');
                    row.className = 'skill-row';
                    row.style.animationDelay = `${0.3 + idx * 0.06}s`;
                    row.innerHTML = `
                        <span class="skill-name">${skill.name}</span>
                        <div class="skill-bar">
                            <div class="skill-bar-fill" data-pct="${meta.pct}"></div>
                        </div>
                    `;
                    container.appendChild(row);
                });

                idx++;
            });

            // Animate bars after render
            requestAnimationFrame(() => {
                document.querySelectorAll('.skill-bar-fill').forEach(bar => {
                    const pct = bar.getAttribute('data-pct');
                    bar.style.width = pct + '%';
                });
            });
        }

        renderSkills();
    </script>

</body>

</html>
